[project]
name = "fumi"
version = "0.2.0"
description = "A calm local workbench for any API with an OpenAPI file."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "watchfiles>=0.24",
    "cryptography>=43",
]

[project.scripts]
fumi = "fumi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
